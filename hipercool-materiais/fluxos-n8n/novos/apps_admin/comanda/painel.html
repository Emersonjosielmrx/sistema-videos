<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comanda · Painel</title><meta name="robots" content="noindex"><meta name="theme-color" content="#C2410C">
<style>__CSS__
.topo{position:sticky;top:0;z-index:20;background:var(--sup);border-bottom:1px solid var(--borda)}
.topo .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.marca{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abas{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.abas button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--tx2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
.abas button.on{color:var(--pri);border-color:var(--pri)}
.abas .bolha{position:absolute;top:4px;right:0;background:var(--er);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1280px;margin:0 auto;padding:16px 16px 90px}
h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2 .esp{flex:1}h2 .btn,h2 select,h2 input{font-size:14px;min-height:38px;padding:7px 12px;width:auto}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mesa{border-radius:16px;padding:14px;cursor:pointer;border:2px solid var(--borda);background:var(--sup);min-height:112px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mesa .n{font-size:24px;font-weight:800}.mesa.ocupada{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--sup))}
.mesa.conta{border-color:var(--av);background:var(--av-bg)}.mesa.chama{animation:pisca 1s infinite}
@keyframes pisca{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--er) 45%,transparent)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sup);border:1px solid var(--borda);border-radius:14px;padding:12px 14px}.kpi .v{font-size:22px;font-weight:800}.kpi .r{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.cozinha{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ped{background:var(--sup);border:1px solid var(--borda);border-left:6px solid var(--mu);border-radius:14px;padding:12px}
.ped.novo{border-left-color:var(--er)}.ped.preparo{border-left-color:var(--av)}.ped.pronto{border-left-color:var(--ok);opacity:.75}
.ped .q{font-size:20px;font-weight:800}.ped .obs{background:var(--av-bg);color:var(--av);border-radius:8px;padding:4px 8px;margin-top:6px;font-weight:600}
.prod{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--borda)}
.prod img,.prod .semfoto{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--sup2);flex:none;display:grid;place-items:center;font-size:24px}
.prod .info{flex:1;min-width:0}.prod .nm{font-weight:700}.prod.off{opacity:.55}
.chave{position:relative;width:46px;height:26px;flex:none}.chave input{opacity:0;width:0;height:0}.chave span{position:absolute;inset:0;background:var(--borda);border-radius:99px;cursor:pointer;transition:.2s}
.chave span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.chave input:checked+span{background:var(--ok)}.chave input:checked+span:before{transform:translateX(20px)}
.cat-t{margin:18px 0 6px;font-weight:800;display:flex;gap:8px;align-items:center}
.barras{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}.barras div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.barras div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--plano);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.eixo{display:flex;gap:3px;font-size:10px;color:var(--mu)}.eixo span{flex:1;text-align:center;overflow:hidden}
.item-c{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--borda)}.item-c.cancelado{opacity:.45;text-decoration:line-through}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:300px;overflow:auto;padding:2px}
.picker button{border:1px solid var(--borda);background:var(--sup2);border-radius:12px;padding:10px;text-align:left;cursor:pointer}.picker button:disabled{opacity:.4}
.carrinho{background:var(--sup2);border-radius:12px;padding:10px;margin-top:10px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.qr{border:1px dashed var(--borda);border-radius:14px;padding:14px;text-align:center;background:#fff;color:#111}
.qr .c{display:flex;justify-content:center;margin:8px 0}
@media print{.topo,.nao-imprime{display:none!important}main{padding:0}.qr{break-inside:avoid}}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.alerta{background:var(--er-bg);color:var(--er);border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:12px}
</style></head><body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API = location.origin + '/webhook/comanda-api';
const IMG = id => location.origin + '/webhook/comanda-img?id=' + id;
__BASE__
const PAPEL_ABAS = {
  dono: ['mesas', 'cozinha', 'caixa', 'produtos', 'estoque', 'relatorios', 'equipe', 'config'],
  caixa: ['mesas', 'cozinha', 'caixa', 'produtos', 'estoque'], garcom: ['mesas', 'cozinha', 'produtos'], cozinha: ['cozinha', 'produtos'] };
const NOME_ABA = { mesas: '🍽️ Mesas', cozinha: '👨‍🍳 Cozinha e bar', caixa: '💰 Caixa', produtos: '📋 Produtos', estoque: '📦 Estoque', relatorios: '📊 Relatórios', equipe: '👥 Equipe', config: '⚙️ Configurações' };
const FORMAS = { dinheiro: '💵 Dinheiro', pix: '⚡ Pix', credito: '💳 Crédito', debito: '💳 Débito' };
const PAPEIS = { dono: 'Dono', caixa: 'Caixa', garcom: 'Garçom', cozinha: 'Cozinha' };
const TIPO_MOV = { venda: '🍽️ venda', estorno: '↩️ estorno', entrada: '📥 entrada', perda: '🗑️ perda', ajuste: '🔧 contagem' };
let EU = null, ABA = null, TIMER = null, CAT = null, ULT_PRONTOS = 0, ULT_CHAMADOS = 0, ULT_NOVOS = 0;
const params = new URLSearchParams(location.search);
window.TOKEN = guarda.ler('cmd_token');

function sair() { api('sair'); guarda.gravar('cmd_token', null); window.TOKEN = ''; telaLogin(); }
function telaLogin(msg) {
  clearInterval(TIMER);
  const loja = params.get('l') || guarda.ler('cmd_loja') || '';
  $('#app').innerHTML = `<div class="login"><div class="card"><h2>🍽️ Entrar no painel</h2>
    ${msg ? `<div class="alerta">${esc(msg)}</div>` : ''}
    <label>Código do estabelecimento</label><input id="lj" value="${esc(loja)}" placeholder="ex.: bar-do-ze-1a2b" autocapitalize="off">
    <label>Usuário</label><input id="lg" value="${esc(params.get('u') || 'dono')}" autocapitalize="off">
    <label>Senha</label><input id="sn" type="password">
    <button class="btn pri" style="width:100%;margin-top:14px" id="ent">Entrar</button>
    <p class="mu pq" style="margin-top:12px">Ainda não tem? <a href="${location.origin}/webhook/comanda">Crie o seu grátis</a>.</p></div></div>`;
  const ir = async () => {
    const j = await api('login', { loja: $('#lj').value.trim(), login: $('#lg').value.trim(), senha: $('#sn').value });
    if (!j.ok) return aviso(j.erro, true);
    window.TOKEN = j.token; guarda.gravar('cmd_token', j.token); guarda.gravar('cmd_loja', $('#lj').value.trim()); iniciar();
  };
  $('#ent').onclick = ir; $('#sn').onkeydown = e => { if (e.key === 'Enter') ir(); };
}
async function iniciar() {
  if (!window.TOKEN) return telaLogin();
  const j = await api('eu');
  if (!j.ok) return telaLogin(j.sair ? '' : j.erro);
  EU = j; document.documentElement.style.setProperty('--pri', j.loja.cor || '#C2410C');
  const abas = PAPEL_ABAS[j.usuario.papel] || ['mesas'];
  $('#app').innerHTML = `<div class="topo"><div class="in"><div class="marca">${esc(j.loja.nome)}</div>
      <span class="selo">${esc(j.usuario.nome)} · ${PAPEIS[j.usuario.papel]}</span>
      <button class="btn fant pq" id="tema" title="Tema">🌓</button><button class="btn pq" onclick="sair()">Sair</button></div>
    <nav class="abas">${abas.map(a => `<button data-aba="${a}">${NOME_ABA[a]}<span class="bolha" hidden></span></button>`).join('')}</nav></div><main id="tela"></main>`;
  tema();
  $$('[data-aba]').forEach(b => b.onclick = () => abrir(b.dataset.aba));
  abrir(location.hash.slice(1) && abas.includes(location.hash.slice(1)) ? location.hash.slice(1) : abas[0]);
}
function abrir(aba) {
  ABA = aba; location.hash = aba; clearInterval(TIMER);
  $$('[data-aba]').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  const f = { mesas: telaMesas, cozinha: telaCozinha, caixa: telaCaixa, produtos: telaProdutos, estoque: telaEstoque, relatorios: telaRelatorios, equipe: telaEquipe, config: telaConfig }[aba];
  $('#tela').innerHTML = '<div class="vazio">Carregando…</div>'; f();
}
const pode = (...p) => p.includes(EU.usuario.papel);

// ═════════ IMPRESSÃO (cupom 80 mm, qualquer impressora térmica ou comum) ═════════
function imprimir(titulo, linhas) {
  const w = window.open('', '_blank', 'width=380,height=640'); if (!w) return aviso('Libere os pop-ups para imprimir.', true);
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>@page{size:80mm auto;margin:3mm}body{font-family:ui-monospace,Consolas,monospace;font-size:13px;width:72mm;margin:0;color:#000}
    h1{font-size:17px;text-align:center;margin:0 0 4px}.c{text-align:center}.g{font-size:16px;font-weight:700}.l{display:flex;justify-content:space-between;gap:6px}.o{font-weight:700;padding-left:10px}hr{border:0;border-top:1px dashed #000;margin:6px 0}</style></head>
    <body>${linhas}<hr><div class="c">${new Date().toLocaleString('pt-BR')}</div><script>window.onload=()=>{window.print();setTimeout(()=>window.close(),400)}<\/script></body></html>`);
  w.document.close();
}
function imprimirConta(mesa, c) {
  imprimir('Conta mesa ' + mesa, `<h1>${esc(EU.loja.nome)}</h1><div class="c">CONFERÊNCIA · MESA ${mesa}</div><hr>
    ${c.itens.filter(i => i.status !== 'cancelado').map(i => `<div class="l"><span>${i.qtd}x ${esc(i.nome)}</span><span>${brl(i.qtd * i.preco_unit)}</span></div>${i.adicionais.length ? `<div>&nbsp;+ ${i.adicionais.map(esc).join(', ')}</div>` : ''}`).join('')}
    <hr><div class="l"><span>Subtotal</span><span>${brl(c.subtotal)}</span></div><div class="l"><span>Serviço ${Number(c.servico_pct)}%</span><span>${brl(c.subtotal * c.servico_pct / 100)}</span></div>
    ${Number(c.desconto) ? `<div class="l"><span>Desconto</span><span>-${brl(c.desconto)}</span></div>` : ''}<div class="l g"><span>TOTAL</span><span>${brl(c.total)}</span></div>
    ${c.pessoas > 1 ? `<div class="l"><span>Por pessoa (${c.pessoas})</span><span>${brl(c.total / c.pessoas)}</span></div>` : ''}<hr><div class="c">Não é documento fiscal</div>`);
}
function imprimirPedido(itens) {
  const porMesa = {}; itens.forEach(i => (porMesa[i.mesa] = porMesa[i.mesa] || []).push(i));
  imprimir('Pedido cozinha', `<div class="c">${esc(EU.loja.nome)} · PEDIDO</div><hr>` + Object.entries(porMesa).map(([m, l]) => `<h1>MESA ${m}</h1><div class="c">${l[0].origem === 'cliente' ? 'pelo QR da mesa' : ''}</div>${l.map(i => `<div class="g">${i.qtd}x ${esc(i.nome)}</div>${i.adicionais.length ? `<div>+ ${i.adicionais.map(esc).join(', ')}</div>` : ''}${i.obs ? `<div class="o">>> ${esc(i.obs)}</div>` : ''}`).join('')}<hr>`).join(''));
}

// ═════════ MESAS ═════════
async function telaMesas() {
  const desenha = async () => {
    const j = await api('mesas'); if (!j.ok || ABA !== 'mesas') return;
    const prontos = j.mesas.reduce((s, m) => s + Number(m.prontos || 0), 0), chamados = j.mesas.filter(m => m.chamado).length;
    if (prontos > ULT_PRONTOS || chamados > ULT_CHAMADOS) bipe();
    ULT_PRONTOS = prontos; ULT_CHAMADOS = chamados;
    const ocup = j.mesas.filter(m => m.comanda);
    $('#tela').innerHTML = `${!j.caixa && pode('dono', 'caixa') ? `<div class="alerta">💰 O caixa está fechado. <a href="#caixa" onclick="abrir('caixa')">Abrir o caixa</a> para receber as contas.</div>` : ''}
      ${j.alertas > 0 && pode('dono', 'caixa') ? `<div class="alerta">📦 ${j.alertas} insumo(s) no estoque mínimo. <a href="#estoque" onclick="abrir('estoque')">Ver estoque</a></div>` : ''}
      <div class="kpis"><div class="kpi"><div class="r">Mesas ocupadas</div><div class="v">${ocup.length}/${j.mesas.length}</div></div>
      <div class="kpi"><div class="r">Em aberto</div><div class="v">${brl(ocup.reduce((s, m) => s + Number(m.total), 0))}</div></div>
      <div class="kpi"><div class="r">Na cozinha</div><div class="v">${j.cozinha}</div></div>
      <div class="kpi"><div class="r">Prontos p/ servir</div><div class="v" style="color:var(--ok)">${prontos}</div></div></div>
      <h2>Mesas <span class="esp"></span><span class="mu pq">atualiza sozinho</span></h2>
      <div class="mesas">${j.mesas.map(m => `<button class="mesa ${m.comanda ? 'ocupada' : ''} ${m.pediu_conta ? 'conta' : ''} ${m.chamado ? 'chama' : ''}" data-m="${m.mesa}">
        <div class="linha" style="flex-wrap:nowrap"><span class="n">${m.mesa}</span>${m.chamado ? `<span class="selo er">${m.chamado === 'conta' ? '🧾 conta' : '🙋 chamou'}</span>` : ''}</div>
        ${m.comanda ? `<div class="forte">${brl(m.total)}</div><div class="mu pq">${tempoDesde(m.aberta_em)}${m.garcom ? ' · ' + esc(m.garcom) : ''}</div>
          ${Number(m.prontos) ? `<span class="selo ok">🔔 ${m.prontos} pronto(s)</span>` : ''}` : '<div class="mu">Livre</div>'}</button>`).join('')}</div>`;
    $$('[data-m]').forEach(b => b.onclick = () => abrirComanda(Number(b.dataset.m)));
    const bolha = $('[data-aba="mesas"] .bolha'); if (bolha) { bolha.hidden = !(prontos + chamados); bolha.textContent = prontos + chamados; }
  };
  await desenha(); TIMER = setInterval(() => { if (!$('.modal-fundo')) desenha(); }, 6000);
}
async function catalogo(forcar) { if (!CAT || forcar) { const j = await api('prod_lista'); if (j.ok) CAT = j; } return CAT; }
async function abrirComanda(mesa) {
  const j = await api('comanda_ver', { mesa }); if (!j.ok) return aviso(j.erro, true);
  const c = j.comanda;
  const st = { novo: '<span class="selo er">novo</span>', preparo: '<span class="selo av">preparando</span>', pronto: '<span class="selo ok">pronto</span>', entregue: '<span class="selo">entregue</span>', cancelado: '<span class="selo">cancelado</span>' };
  const m = modal(`<h3>Mesa ${mesa} ${c ? `· <span class="num">${brl(c.total)}</span>` : '· livre'}</h3>
    ${c ? `<p class="mu pq">Aberta há ${tempoDesde(c.aberta_em)} · ${c.pessoas} pessoa(s) · serviço ${Number(c.servico_pct)}%${Number(c.desconto) ? ' · desconto ' + brl(c.desconto) : ''}</p>
      <div style="margin-top:8px">${c.itens.map(it => `<div class="item-c ${it.status}"><div style="flex:1"><b>${it.qtd}x ${esc(it.nome)}</b>
        ${it.adicionais.length ? `<div class="pq mu">+ ${it.adicionais.map(esc).join(', ')}</div>` : ''}${it.obs ? `<div class="pq">📝 ${esc(it.obs)}</div>` : ''}
        <div class="pq mu">${it.origem === 'cliente' ? '📱 pelo QR' : esc(it.usuario)} · ${new Date(it.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}${it.motivo ? ' · ' + esc(it.motivo) : ''}</div></div>
        <div style="text-align:right"><div class="num">${brl(it.qtd * it.preco_unit)}</div>${st[it.status]}
        ${it.status === 'pronto' ? `<br><button class="btn pq ok" data-ent="${it.id}" style="margin-top:4px">Servido</button>` : ''}
        ${it.status !== 'cancelado' && it.status !== 'entregue' ? `<br><button class="btn pq fant er" data-can="${it.id}">Cancelar</button>` : ''}</div></div>`).join('')}</div>
      <div class="linha" style="margin-top:10px;justify-content:space-between"><span class="mu">Subtotal ${brl(c.subtotal)} + serviço ${brl(c.subtotal * c.servico_pct / 100)}${Number(c.desconto) ? ' − ' + brl(c.desconto) : ''}</span><b class="num" style="font-size:20px;flex:none">${brl(c.total)}</b></div>` : '<p class="mu">Nenhum pedido ainda. Lance o primeiro item para abrir a mesa.</p>'}
    <div class="acoes" style="flex-wrap:wrap"><button class="btn" data-fechar>Fechar</button>
      ${c ? `<button class="btn" data-mais>⋯ Mais</button><button class="btn" data-imp>🖨️ Conta</button>` : ''}
      ${c && pode('dono', 'caixa') ? `<button class="btn ok" data-receber>💰 Receber</button>` : ''}
      <button class="btn pri" data-add>＋ Lançar itens</button></div>`);
  $('[data-add]', m).onclick = () => { m.fechar(); lancarItens(mesa); };
  $$('[data-can]', m).forEach(b => b.onclick = async () => {
    const motivo = prompt('Motivo do cancelamento (fica registrado):'); if (!motivo) return;
    if (await chama('item_cancelar', { id: Number(b.dataset.can), motivo }, 'Item cancelado')) { m.fechar(); abrirComanda(mesa); } });
  $$('[data-ent]', m).forEach(b => b.onclick = async () => { if (await chama('item_status', { id: Number(b.dataset.ent), status: 'entregue' })) { m.fechar(); abrirComanda(mesa); } });
  if (c) {
    $('[data-mais]', m).onclick = () => { m.fechar(); maisComanda(mesa, c); };
    $('[data-imp]', m).onclick = () => imprimirConta(mesa, c);
    const r = $('[data-receber]', m); if (r) r.onclick = () => { m.fechar(); receber(mesa, c); };
  }
}
function maisComanda(mesa, c) {
  const m = modal(`<h3>Mesa ${mesa} · ajustes</h3>
    <div class="linha"><div><label>Pessoas</label><input id="pe" type="number" min="1" value="${c.pessoas}"></div>
    <div><label>Serviço (%)</label><input id="sv" type="number" min="0" max="20" value="${Number(c.servico_pct)}"></div>
    ${pode('dono', 'caixa') ? `<div><label>Desconto (R$)</label><input id="ds" inputmode="decimal" value="${Number(c.desconto) || ''}"></div>` : ''}</div>
    <button class="btn" id="salva" style="margin-top:10px">Salvar ajustes</button>
    <label style="margin-top:18px">Transferir ou juntar com a mesa</label><div class="linha"><input id="pr" type="number" min="1" max="${EU.loja.mesas}" placeholder="nº da mesa"><button class="btn" id="tr" style="flex:none">Transferir / juntar</button></div>
    <p class="mu pq">Se a outra mesa estiver livre, a comanda muda de lugar. Se estiver ocupada, as duas viram uma conta só.</p>
    ${pode('dono', 'caixa') ? `<label style="margin-top:18px">Cancelar a comanda inteira</label><button class="btn er" id="cc">Cancelar comanda</button>` : ''}
    <div class="acoes"><button class="btn" data-fechar>Voltar</button></div>`);
  $('#salva', m).onclick = async () => { const d = { mesa, pessoas: Number($('#pe', m).value), servico_pct: Number($('#sv', m).value) };
    if ($('#ds', m)) d.desconto = numIn($('#ds', m).value); if (await chama('comanda_ajustar', d, 'Ajustado')) { m.fechar(); abrirComanda(mesa); } };
  $('#tr', m).onclick = async () => { const para = Number($('#pr', m).value); if (!para) return;
    if (await chama('comanda_transferir', { de: mesa, para }, 'Feito')) { m.fechar(); abrirComanda(para); } };
  const cc = $('#cc', m); if (cc) cc.onclick = async () => { const motivo = prompt('Motivo do cancelamento da comanda inteira:'); if (!motivo) return;
    if (await chama('comanda_cancelar', { mesa, motivo }, 'Comanda cancelada')) m.fechar(); };
}
async function lancarItens(mesa) {
  const cat = await catalogo(true); if (!cat) return;
  const carrinho = [];
  const m = modal(`<h3>Lançar na mesa ${mesa}</h3><input id="busca" placeholder="🔎 Buscar produto">
    <div class="linha" id="cats" style="margin:8px 0;gap:6px">${cat.categorias.map(c => `<button class="btn pq" data-c="${c.id}" style="flex:none">${esc(c.icone)} ${esc(c.nome)}</button>`).join('')}</div>
    <div class="picker" id="pk"></div><div class="carrinho" id="car"></div>

async function receber(mesa, c) {
  const pix = await api('pix');

  const m = modal(`<h3>Receber · mesa ${mesa}</h3><div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="r">Total</div><div class="v num">${brl(c.total)}</div></div>

    <div class="linha"><button class="btn pq" id="div" style="flex:none">Dividir em partes iguais</button><input id="np" type="number" min="1" value="${c.pessoas}" style="max-width:90px;flex:none"></div>
    <div id="pgs" style="margin-top:10px"></div><button class="btn pq" id="maisf" style="margin-top:6px">＋ Outra forma de pagamento</button>
    <div id="res" style="margin-top:12px;font-weight:700"></div><div id="pixqr" style="margin-top:10px;text-align:center"></div>
    <div class="acoes"><button class="btn" data-fechar>Voltar</button><button class="btn ok" id="fin">Confirmar recebimento</button></div>`);
  const desenha = () => {
    $('#pgs', m).innerHTML = pags.map((p, i) => `<div class="linha" style="flex-wrap:nowrap;margin-bottom:6px"><select data-f="${i}" style="flex:1">${Object.entries(FORMAS).map(([k, v]) => `<option value="${k}" ${p.forma === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <input data-v="${i}" inputmode="decimal" value="${p.valor.toFixed(2).replace('.', ',')}" style="max-width:130px;flex:none">${pags.length > 1 ? `<button class="btn pq fant er" data-x="${i}" style="flex:none">✕</button>` : ''}</div>`).join('');
    $$('[data-f]', m).forEach(s => s.onchange = () => { pags[Number(s.dataset.f)].forma = s.value; resumo(); });
    $$('[data-v]', m).forEach(s => s.oninput = () => { pags[Number(s.dataset.v)].valor = numIn(s.value); resumo(); });
    $$('[data-x]', m).forEach(b => b.onclick = () => { pags.splice(Number(b.dataset.x), 1); desenha(); });
    resumo();
  };
  const resumo = () => { const pago = pags.reduce((s, p) => s + p.valor, 0), dif = pago - Number(c.total);
    $('#res', m).innerHTML = dif < -0.009 ? `<span style="color:var(--er)">Faltam ${brl(-dif)}</span>` : dif > 0.009 ? `<span style="color:var(--ok)">Troco: ${brl(dif)}</span>` : '<span style="color:var(--ok)">✔ Valor certo</span>';
    const vp = pags.filter(p => p.forma === 'pix').reduce((s, p) => s + p.valor, 0);
    $('#pixqr', m).innerHTML = '';
    if (vp > 0 && pix.ok && pix.chave && window.QRCode) { const cod = pixCopiaECola({ chave: pix.chave, nome: pix.nome, cidade: pix.cidade, valor: vp, txid: 'MESA' + mesa });
      const d = document.createElement('div'); d.style.cssText = 'display:inline-block;background:#fff;padding:10px;border-radius:12px'; $('#pixqr', m).append(d);
      new QRCode(d, { text: cod, width: 180, height: 180 }); const b = document.createElement('button'); b.className = 'btn pq'; b.textContent = '📋 Copiar Pix ' + brl(vp);
      b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(cod); aviso('Pix copiado'); }; $('#pixqr', m).append(document.createElement('br'), b);
    } else if (vp > 0 && pix.ok && !pix.chave) $('#pixqr', m).innerHTML = '<span class="mu pq">Cadastre a chave Pix em Configurações para mostrar o QR aqui.</span>';
  };
  $('#div', m).onclick = () => { const n = Math.max(1, Number($('#np', m).value) || 1), parte = Math.floor(Number(c.total) / n * 100) / 100;
    pags.length = 0; for (let i = 0; i < n; i++) pags.push({ forma: 'pix', valor: i === n - 1 ? Math.round((Number(c.total) - parte * (n - 1)) * 100) / 100 : parte }); desenha(); };
  $('#maisf', m).onclick = () => { const falta = Math.max(0, Number(c.total) - pags.reduce((s, p) => s + p.valor, 0)); pags.push({ forma: 'dinheiro', valor: Math.round(falta * 100) / 100 }); desenha(); };
  $('#fin', m).onclick = async () => { const j = await chama('comanda_fechar', { mesa, pagamentos: pags });
    if (j) { m.fechar(); aviso(j.troco > 0 ? `Conta fechada · troco ${brl(j.troco)}` : 'Conta fechada ✔'); if (ABA === 'mesas') telaMesas(); } };
  desenha();
}

    <div class="kpis"><div class="kpi"><div class="r">Faturamento</div><div class="v num">${brl(j.faturamento)}</div></div><div class="kpi"><div class="r">Contas</div><div class="v">${j.comandas}</div><div class="mu pq">${j.pessoas} pessoas</div></div>
    <div class="kpi"><div class="r">Ticket médio</div><div class="v num">${brl(j.ticket)}</div><div class="mu pq">${brl(j.pessoas ? j.faturamento / j.pessoas : 0)} por pessoa</div></div>
    <div class="kpi"><div class="r">Serviço (garçons)</div><div class="v num">${brl(j.servico)}</div></div><div class="kpi"><div class="r">Custo dos produtos</div><div class="v num">${brl(j.custo)}</div><div class="mu pq">pela ficha técnica</div></div>
    <div class="kpi"><div class="r">Lucro bruto</div><div class="v num" style="color:var(--ok)">${brl(lucro)}</div><div class="mu pq">${j.faturamento ? Math.round(lucro / j.faturamento * 100) : 0}% · descontos ${brl(j.descontos)}</div></div>
    <div class="kpi"><div class="r">Tempo de cozinha</div><div class="v">${j.tempo_cozinha_min ?? '—'} min</div><div class="mu pq">média por item</div></div></div>
    <div class="card" style="margin-bottom:12px"><div class="linha"><b>✨ Análise da IA</b><span></span><button class="btn pri" id="ia" style="flex:none">Pedir análise</button></div><div id="iar" class="mu" style="margin-top:8px;white-space:pre-wrap">A IA olha os números deste período e diz o que fazer para vender mais.</div></div>
    <div class="g2"><div class="card"><b>Vendas por dia</b><div class="barras">${j.por_dia.map(d => `<div style="height:${d.total / maxD * 100}%" data-t="${new Date(d.dia + 'T12:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}: ${brl(d.total)}"></div>`).join('')}</div>
      <div class="eixo">${j.por_dia.map(d => `<span>${j.por_dia.length <= 14 ? new Date(d.dia + 'T12:00').toLocaleDateString('pt-BR', { day: '2-digit' }) : ''}</span>`).join('')}</div></div>
    <div class="card"><b>Movimento por horário</b><div class="barras">${j.por_hora.map(d => `<div style="height:${d.total / maxH * 100}%" data-t="${d.hora}h: ${brl(d.total)}"></div>`).join('')}</div><div class="eixo">${j.por_hora.map(d => `<span>${d.hora % 3 === 0 ? d.hora : ''}</span>`).join('')}</div></div>
    <div class="card"><b>Formas de pagamento</b>${Object.entries(j.formas).map(([k, v]) => `<div class="linha pq" style="flex-wrap:nowrap;margin-top:6px"><span style="flex:1">${FORMAS[k] || k}</span><b class="num" style="flex:none">${brl(v)}</b></div>`).join('') || '<div class="vazio pq">—</div>'}
      <b style="display:block;margin-top:14px">Por garçom</b>${j.garcons.map(g => `<div class="linha pq" style="flex-wrap:nowrap;margin-top:6px"><span style="flex:1">${esc(g.quem)} · ${g.itens} itens</span><b class="num" style="flex:none">${brl(g.valor)}</b></div>`).join('') || '<div class="vazio pq">—</div>'}</div></div>
    <h2 style="margin-top:20px">Produtos (curva ABC)</h2><div class="card tabela"><table><tr><th>Produto</th><th>Qtd</th><th>Vendido</th><th>Custo</th><th>Margem</th><th>Curva</th></tr>
    ${j.produtos.map(p => { acum += Number(p.valor); const cl = acum / totP <= .8 ? 'A' : acum / totP <= .95 ? 'B' : 'C';
      return `<tr><td>${esc(p.nome)}</td><td class="num">${p.qtd}</td><td class="num">${brl(p.valor)}</td><td class="num">${Number(p.custo) ? brl(p.custo) : '<span class="mu">sem ficha</span>'}</td>
      <td class="num">${Number(p.custo) ? Math.round((1 - p.custo / p.valor) * 100) + '%' : '—'}</td><td><span class="selo ${cl === 'A' ? 'ok' : cl === 'B' ? 'av' : ''}">${cl}</span></td></tr>`; }).join('') || '<tr><td colspan="6" class="vazio">Nenhuma venda no período</td></tr>'}</table></div>
    <h2 style="margin-top:20px">Cancelamentos</h2><div class="card tabela"><table><tr><th>Quando</th><th>Item</th><th>Valor</th><th>Quem</th><th>Motivo</th></tr>
    ${j.cancelados.map(c => `<tr><td>${new Date(c.em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${c.qtd}x ${esc(c.nome)}</td><td class="num">${brl(c.valor)}</td><td>${esc(c.por)}</td><td class="pq">${esc(c.motivo)}</td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Nenhum cancelamento 👍</td></tr>'}</table></div>`;
  const per = d => telaRelatorios(new Date(Date.now() - d * 864e5).toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' }), hoje);
  $('#hj').onclick = () => per(0); $('#d7').onclick = () => per(6); $('#d30').onclick = () => per(29);
  $('#de').onchange = $('#ate').onchange = () => telaRelatorios($('#de').value, $('#ate').value);
  $('#ia').onclick = async () => { $('#iar').textContent = '⏳ Analisando…'; const r = await api('ia_analise', { de, ate }); $('#iar').textContent = r.ok ? String(r.resultado || '').replace(/\*\*/g, '') : r.erro; };
}

// ═════════ EQUIPE ═════════
async function telaEquipe() {
  const [u, a] = await Promise.all([api('usuarios'), api('atividades')]); if (!u.ok) return aviso(u.erro, true);
  $('#tela').innerHTML = `<h2>👥 Equipe <span class="esp"></span><button class="btn pri" id="nu">＋ Pessoa</button></h2>
    <div class="card tabela"><table><tr><th>Nome</th><th>Usuário</th><th>Papel</th><th>Situação</th><th></th></tr>${u.usuarios.map(x => `<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.login)}</td><td>${PAPEIS[x.papel]}</td>
      <td>${x.ativo ? '<span class="selo ok">ativo</span>' : '<span class="selo">bloqueado</span>'}</td><td><button class="btn pq" data-u="${x.id}">Editar</button></td></tr>`).join('')}</table></div>
    <p class="mu pq" style="margin:8px 0 20px">👑 Dono vê tudo · 💰 Caixa recebe contas, caixa e estoque · 🍽️ Garçom lança pedidos e marca esgotado · 👨‍🍳 Cozinha só vê a tela de pedidos.<br>Cada pessoa entra com o código <b>${esc(EU.loja.slug)}</b>, o usuário e a senha dela.</p>
    <h2>📜 Registro de atividades</h2><div class="card tabela"><table><tr><th>Quando</th><th>Quem</th><th>O quê</th></tr>${(a.atividades || []).map(x => `<tr><td class="pq">${new Date(x.em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${esc(x.usuario)}</td><td><b>${esc(x.acao)}</b> <span class="mu">${esc(x.detalhe)}</span></td></tr>`).join('')}</table></div>`;
  const editar = x => { const m = modal(`<h3>${x ? 'Editar' : 'Nova'} pessoa</h3><label>Nome</label><input id="nm" value="${esc(x ? x.nome : '')}">
    <div class="linha"><div><label>Usuário (para entrar)</label><input id="lg" value="${esc(x ? x.login : '')}" ${x ? 'disabled' : ''} autocapitalize="off"></div><div><label>${x ? 'Nova senha (deixe vazio para manter)' : 'Senha'}</label><input id="sn" type="text"></div></div>
    <label>Papel</label><select id="pp">${Object.entries(PAPEIS).map(([k, v]) => `<option value="${k}" ${x && x.papel === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    ${x ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="at" style="width:auto;min-height:0" ${x.ativo ? 'checked' : ''}> Pode entrar no sistema</label>` : ''}
    <div class="acoes"><button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="ok">Salvar</button></div>`);
    if (!x) $('#pp', m).value = 'garcom';
    $('#ok', m).onclick = async () => { if (await chama('usuario_salvar', { id: x ? x.id : 0, nome: $('#nm', m).value, login: $('#lg', m).value, senha: $('#sn', m).value, papel: $('#pp', m).value, ativo: x ? $('#at', m).checked : true }, 'Salvo')) { m.fechar(); telaEquipe(); } }; };
  $('#nu').onclick = () => editar(null); $$('[data-u]').forEach(b => b.onclick = () => editar(u.usuarios.find(x => x.id === Number(b.dataset.u))));
}

// ═════════ CONFIGURAÇÕES ═════════
async function telaConfig() {
  const j = await api('config_ver'); if (!j.ok) return aviso(j.erro, true); const c = j.config; let logo = c.logo;
  const base = location.origin + '/webhook/comanda-mesa';
  $('#tela').innerHTML = `<div class="g2 nao-imprime"><div class="card"><h2>⚙️ Estabelecimento</h2><label>Nome</label><input id="nm" value="${esc(c.nome)}">
    <div class="linha"><div><label>Tipo</label><select id="tp">${['restaurante', 'bar', 'lanchonete', 'pizzaria', 'hamburgueria', 'cafeteria', 'sorveteria', 'açaí', 'outro'].map(t => `<option ${c.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div><label>Mesas</label><input id="ms" type="number" min="1" max="80" value="${c.mesas}"></div></div>
    <div class="linha"><div><label>Taxa de serviço (%)</label><input id="tx" type="number" min="0" max="20" value="${Number(c.taxa_servico)}"></div><div><label>Cor</label><input id="cr" type="color" value="${esc(c.cor)}" style="padding:4px"></div></div>
    <label>WhatsApp</label><input id="wa" inputmode="tel" value="${esc(c.whatsapp)}">
    <label>Logo</label><div class="linha"><div id="lv" style="flex:0 0 64px;height:64px;border-radius:12px;background:var(--sup2);display:grid;place-items:center;overflow:hidden"></div><input type="file" id="lf" accept="image/*"></div></div>
    <div class="card"><h2>⚡ Pix</h2><p class="mu pq">Com a chave, o caixa mostra o QR do Pix com o valor certo na hora de receber.</p><label>Chave Pix</label><input id="pk" value="${esc(c.pix_chave)}" placeholder="CPF, CNPJ, e-mail, celular ou aleatória">
    <label>Nome do recebedor</label><input id="pn" value="${esc(c.pix_nome)}" maxlength="25"><label>Cidade</label><input id="pc" value="${esc(c.pix_cidade)}" maxlength="15">
    <button class="btn pri" id="sv" style="margin-top:16px;width:100%">Salvar configurações</button></div></div>
    <h2 style="margin-top:22px">📱 QR das mesas <span class="esp"></span><button class="btn nao-imprime" onclick="print()">🖨️ Imprimir</button></h2>
    <p class="mu pq nao-imprime" style="margin-bottom:10px">Cole na mesa. O cliente abre o cardápio no celular, pede e chama o garçom. Cada QR só serve para a mesa dele.</p>
    <div class="qrs">${j.qrs.map(q => `<div class="qr"><b style="font-size:18px">${esc(c.nome)}</b><div class="c" data-qr="${base}?l=${encodeURIComponent(EU.loja.slug)}&m=${q.mesa}&t=${q.t}"></div><b style="font-size:22px">Mesa ${q.mesa}</b><div style="font-size:12px">Aponte a câmera e peça pelo celular</div></div>`).join('')}</div>`;
  $$('[data-qr]').forEach(d => window.QRCode && new QRCode(d, { text: d.dataset.qr, width: 150, height: 150 }));
  const lv = () => $('#lv').innerHTML = logo ? `<img src="${IMG(logo)}" style="width:100%;height:100%;object-fit:contain">` : '🏪'; lv();
  $('#lf').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const r = await chama('img_salvar', { mime: 'image/jpeg', b64: await reduzFoto(f, 600) }); if (r) { logo = r.id; lv(); } } catch (er) { aviso(er.message, true); } };
  $('#sv').onclick = async () => { if (await chama('config_salvar', { nome: $('#nm').value, tipo: $('#tp').value, mesas: Number($('#ms').value), taxa_servico: Number($('#tx').value), cor: $('#cr').value, whatsapp: $('#wa').value, pix_chave: $('#pk').value, pix_nome: $('#pn').value, pix_cidade: $('#pc').value, logo: logo || '' }, 'Configurações salvas')) iniciar(); };
}
iniciar();
</script></body></html>
