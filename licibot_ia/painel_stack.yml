# Publica o painel do LiciBot com HTTPS pelo Traefik do Swarm.
# O painel (painel.py, serviço systemd licibot-painel) escuta em 172.18.0.1:20180 no host;
# este nginx só repassa. Subir:  docker stack deploy -c painel_stack.yml licibot
version: "3.8"
services:
  painel:
    image: nginx:1.27-alpine
    configs:
      - source: licibot_nginx_v1
        target: /etc/nginx/conf.d/default.conf
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.licibot.entrypoints=websecure
        - traefik.http.routers.licibot.rule=Host(`licitacoes.157-173-207-22.sslip.io`)
        - traefik.http.routers.licibot.tls.certresolver=letsencryptresolver
        - traefik.http.services.licibot.loadbalancer.server.port=80

configs:
  licibot_nginx_v1:
    file: ./painel_nginx.conf

networks:
  network_swarm_public:
    external: true
